on:
  push:
    branches:
      - main

name: FRONTEND
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ctm002/pilaresverdes-frontend:${{ github.sha }}
          build-args: |
            VITE_BUILD_HASH=${{ github.sha }}

      - name: Set permissions for private key
        run: |
          mkdir -p ~/.ssh/
          echo "${{ secrets.AWS_PRIVATE_KEY }}" > ~/.ssh/key.pem
          chmod 400 ~/.ssh/key.pem
          cat >>~/.ssh/config <<END
          Host staging
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/key.pem
            StrictHostKeyChecking no
          END
        env:
          SSH_USER: ${{ vars.STAGING_SSH_USER }}
          SSH_HOST: ${{ vars.STAGING_SSH_HOST }}

      - name: Copy docker-compose to server
        run: |
          scp docker-compose.frontend.yml staging:~/docker-compose.frontend.yml

      - name: Deploy with docker compose
        run: |
          ssh staging 'IMAGE_TAG=${{ github.sha }} \
            docker compose -f ~/docker-compose.frontend.yml up -d --pull always'